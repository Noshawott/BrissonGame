<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #222;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            background: #333;
            cursor: crosshair;
        }
        #ui-text {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            pointer-events: none;
            font-weight: normal;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h3 id="ui-text">Early Test, you can click on platforms above to spawn swinging rope [F11 Fullscreen]</h3>
    <canvas id="canvas"></canvas>

<script type = "text/javascript" src = "js/gameloop.js"></script>
</body>
</html>
