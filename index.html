<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #222;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            background: #333;
            cursor: crosshair;
        }
        #ui-text {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            pointer-events: none;
            font-weight: normal;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h3 id="ui-text">Floating Arc Speedometer Active! Watch your MPH hit redline on dashes. [F11 Fullscreen]</h3>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ENGINE STATE MACHINE
let gameState = "PLAYING";

// Player variables
let px = 80, py = 100, vx = 0, vy = 0, angle = 0, grounded = false;
const radius = 15;

// TRACKING STUCK TIME FOR ADAPTIVE REELING
let stuckFrames = 0;

// DASH & SPEED LINES
let dashCooldown = 0;      
let dashActiveTimer = 0;   
let speedLines = [];       

// DYNAMIC CHECKPOINT TRACKING METRICS
let checkpoint = { x: 80, y: 100 }; 

// Camera states
let camX = px - canvas.width / 2;
let camY = py - canvas.height / 2;
const camSmoothing = 0.08;

// Rope variables
let rope = { active: false, x: 0, y: 0, length: 0 };

// Platforms [x, y, width, height]
const platforms = [
    [0, 150, 200, 30],       // Start platform
    [550, 230, 150, 30],     // Island Platform 1
    [1050, 320, 150, 30],    // Island Platform 2
    [1550, 420, 150, 30],    // Island Platform 3
    [2100, 480, 200, 30],    // Island Platform 4
    [2700, 560, 400, 30],    // Final goal floor
    
    // ENHANCED SKY-HIGH ANCHORS
    [250, -180, 250, 40],      
    [750, -150, 250, 40],      
    [1250, -120, 250, 40],    
    [1750, -100, 250, 40],    
    [2350, -80, 300, 40]     
];

// Slopes [x1, y1, x2, y2]
const slopes = [
    [200, 150, 450, 230],    
    [700, 230, 950, 320],   
    [1200, 320, 1450, 420],  
    [1700, 420, 1950, 480],  
    [2300, 480, 2550, 560]   
];

// Checkpoints [x, y, width, height]
const checkpoints = [
    [570, 210, 30, 20],     
    [1570, 400, 30, 20],    
    [2120, 460, 30, 20]     
];

const goal = { x: 2950, y: 525, w: 25, h: 25 };

const keys = {};
window.onkeydown = (e) => {
    if (e.key === "Shift") {
        triggerDash();
    }
    keys[e.key] = true;
    if (gameState === "VICTORY" && e.key === " ") {
        resetGameToStart();
    }
};
window.onkeyup = (e) => keys[e.key] = false;

function triggerDash() {
    if (dashCooldown > 0 || gameState !== "PLAYING") return;

    let dx = 0; let dy = 0;
    if (keys['ArrowLeft'] || keys['a']) dx = -1;
    if (keys['ArrowRight'] || keys['d']) dx = 1;
    if (keys['ArrowUp'] || keys['w'] || keys[' ']) dy = -1;
    if (keys['ArrowDown'] || keys['s']) dy = 1;

    if (dx === 0 && dy === 0) {
        dx = vx >= 0 ? 1 : -1;
    }

    let len = Math.sqrt(dx * dx + dy * dy);
    dx /= len; dy /= len;

    const dashPower = 32;
    vx = dx * dashPower;
    vy = dy * dashPower;

    rope.active = false;
    grounded = false;

    dashActiveTimer = 15; 
    dashCooldown = 50;    
}

function resetGameToStart() {
    checkpoint.x = 80;
    checkpoint.y = 100;
    respawnPlayerAtCheckpoint();
    gameState = "PLAYING";
}

function respawnPlayerAtCheckpoint() {
    px = checkpoint.x; 
    py = checkpoint.y - 10; 
    vx = 0; 
    vy = 0; 
    angle = 0;
    rope.active = false;
    stuckFrames = 0;
    dashActiveTimer = 0;
    dashCooldown = 0;
    speedLines = [];
}

// --- ROPE INTERACTION ---
canvas.onmousedown = (e) => {
    if (gameState !== "PLAYING") return; 
    
    let rect = canvas.getBoundingClientRect();
    let worldX = e.clientX - rect.left + camX;
    let worldY = e.clientY - rect.top + camY;

    for (let p of platforms) {
        if (worldX >= p[0] && worldX <= p[0] + p[2] && worldY >= p[1] && worldY <= p[1] + p[3]) {
            rope.x = worldX; rope.y = worldY; rope.active = true;
            let dx = px - rope.x, dy = py - rope.y;
            rope.length = Math.sqrt(dx * dx + dy * dy);
            stuckFrames = 0; 
            break; 
        }
    }
};
window.onmouseup = () => {
    rope.active = false;
    stuckFrames = 0;
};

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "PLAYING") {
        if (dashCooldown > 0) dashCooldown--;
        if (dashActiveTimer > 0) dashActiveTimer--;

        // 1. Movement Calculations
        let accel = rope.active ? 0.05 : 0.15; 
        if (keys['ArrowLeft'] || keys['a']) vx = Math.max(-12, vx - accel);
        else if (keys['ArrowRight'] || keys['d']) vx = Math.min(12, vx + accel);
        else if (!rope.active && grounded && dashActiveTimer <= 0) vx *= 0.98; 

        if ((keys[' '] || keys['ArrowUp'] || keys['w']) && grounded && dashActiveTimer <= 0) {
            vy = -9;
            grounded = false;
            stuckFrames = 0;
        }

        if (dashActiveTimer <= 0) {
            vy += 0.4; 
        }
        
        px += vx;
        py += vy;

        // SPEED LINES EMITTER
        let currentSpeed = Math.sqrt(vx * vx + vy * vy);
        if (dashActiveTimer > 0 || currentSpeed > 16.0) {
            let particleCount = dashActiveTimer > 0 ? 3 : 1;
            for(let k=0; k<particleCount; k++) {
                let offsetAngle = Math.random() * Math.PI * 2;
                let offsetRadius = Math.random() * (radius - 2);
                
                speedLines.push({
                    x: px + Math.cos(offsetAngle) * offsetRadius,
                    y: py + Math.sin(offsetAngle) * offsetRadius,
                    vx: vx * 0.4, 
                    vy: vy * 0.4,
                    alpha: 0.9,
                    width: 3 + Math.random() * 4
                });
            }
        }

        // 2. FIXED-LENGTH ROPE SWING & ADAPTIVE STUCK WINCH LOGIC
        if (rope.active) {
            if (grounded && currentSpeed < 0.5) {
                stuckFrames++;
                let winchSpeed = 2 + Math.min(5, stuckFrames / 12); 
                rope.length -= winchSpeed; 
                if (rope.length < 50) rope.length = 50; 
            } else {
                if (stuckFrames > 0) stuckFrames -= 2;
                if (stuckFrames < 0) stuckFrames = 0;
            }

            let dx = px - rope.x, dy = py - rope.y;
            let currentDist = Math.sqrt(dx * dx + dy * dy);
            if (currentDist > 0) {
                let nx = dx / currentDist, ny = dy / currentDist;
                px = rope.x + nx * rope.length;
                py = rope.y + ny * rope.length;
                let velAlongNormal = vx * nx + vy * ny;
                vx -= velAlongNormal * nx;
                vy -= velAlongNormal * ny;
                vx -= nx * 0.05; vy -= ny * 0.05; 
            }
        } else {
            stuckFrames = 0;
        }

        // 3. SLOPE PHYSICS
        grounded = false;
        for (let s of slopes) {
            let x1 = s[0], y1 = s[1], x2 = s[2], y2 = s[3];
            let dx = x2 - x1, dy = y2 - y1;
            let segLength = Math.sqrt(dx * dx + dy * dy);
            let tx = dx / segLength, ty = dy / segLength;
            let pAx = px - x1, pAy = py - y1;

            let projection = pAx * tx + pAy * ty;
            let t = Math.max(0, Math.min(segLength, projection));
            let closestX = x1 + t * tx, closestY = y1 + t * ty;

            let distVecX = px - closestX, distVecY = py - closestY;
            let distance = Math.sqrt(distVecX * distVecX + distVecY * distVecY);

            if (distance <= radius && px >= Math.min(x1, x2) - 2 && px <= Math.max(x1, x2) + 2) {
                if (vy >= -0.5 && py <= closestY + 2) {
                    
                    if (rope.active) {
                        if (currentSpeed < 0.5) {
                            py = closestY - radius;
                            grounded = true;
                            vx = 0;
                            vy = 0;
                        } else {
                            py = closestY - radius;
                            grounded = true;
                            let currentSpeedOnSlope = vx * tx + vy * ty;
                            vx = currentSpeedOnSlope * tx;
                            vy = currentSpeedOnSlope * ty;
                            rope.length -= 3;
                            if (rope.length < 40) rope.length = 40;
                        }
                    } else {
                        py = closestY - radius;
                        grounded = true;

                        let currentSpeedOnSlope = vx * tx + vy * ty;
                        vx = currentSpeedOnSlope * tx;
                        vy = currentSpeedOnSlope * ty;

                        if (dashActiveTimer <= 0) {
                            let gravityPull = 0.4 * ty; 
                            vx += gravityPull * tx;
                            vy += gravityPull * ty;
                        }
                    }
                }
            }
        }

        // 4. Flat Platform Landings & Robust Phasing Defenses
        for (let p of platforms) {
            if (px + radius > p[0] && px - radius < p[0] + p[2] && 
                py + radius > p[1] && py - radius < p[1] + p[3]) {
                
                if (rope.active) {
                    if (Math.abs(vx) >= 0.5) {
                        if (py > p[1]) {
                            py = p[1] - radius;
                            if (vy > 0) vy = 0;
                        }
                        
                        rope.length -= 6; 
                        if (rope.length < 40) rope.length = 40; 
                        
                        let dx = px - rope.x, dy = py - rope.y;
                        let currentDist = Math.sqrt(dx * dx + dy * dy);
                        if (currentDist > 0) {
                            px = rope.x + (dx / currentDist) * rope.length;
                            py = rope.y + (dy / currentDist) * rope.length;
                        }
                        if (py > p[1] - radius) py = p[1] - radius;
                    } else {
                        py = p[1] - radius;
                        vy = 0;
                        grounded = true;
                    }
                } else if (vy > 0 || dashActiveTimer > 0) { 
                    py = p[1] - radius; 
                    vy = 0; 
                    grounded = true;
                    dashActiveTimer = 0; 
                }
            }
        }

        // 5. CHECKPOINT REGISTRATION
        for (let cp of checkpoints) {
            if (px + radius > cp[0] && px - radius < cp[0] + cp[2] &&
                py + radius > cp[1] && py - radius < cp[1] + cp[3]) {
                checkpoint.x = cp[0] + cp[2] / 2;
                checkpoint.y = cp[1];
            }
        }

        angle += vx / radius; 
        
        if (py > 950) {
            respawnPlayerAtCheckpoint();
        }

        // 6. Check Win Condition
        if (px + radius > goal.x && px - radius < goal.x + goal.w &&
            py + radius > goal.y && py - radius < goal.y + goal.h) {
            gameState = "VICTORY";
        }

        // 7. Dynamic Camera Tracking
        let targetCamX = px - canvas.width / 2;
        let targetCamY = py - canvas.height / 2;
        camX += (targetCamX - camX) * camSmoothing;
        camY += (targetCamY - camY) * camSmoothing;
        if (camX < 0) camX = 0; 

        // 8. RENDER GAMEPLAY LAYER
        ctx.save(); 
        ctx.translate(-camX, -camY); 

        // RENDER CARTOON SPEED LINES
        for (let i = speedLines.length - 1; i >= 0; i--) {
            let sl = speedLines[i];
            sl.alpha -= 0.05; 
            
            if (sl.alpha <= 0) {
                speedLines.splice(i, 1);
                continue;
            }

            ctx.strokeStyle = `rgba(255, 255, 255, ${sl.alpha})`;
            ctx.lineWidth = sl.width * sl.alpha;
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(sl.x, sl.y);
            ctx.lineTo(sl.x - vx * 2.5, sl.y - vy * 2.5);
            ctx.stroke();
        }

        // Platforms & Extended Anchors (Grey)
        ctx.fillStyle = '#666'; 
        for (let p of platforms) ctx.fillRect(p[0], p[1], p[2], p[3]);

        // Draw Checkpoints (Purple)
        ctx.fillStyle = '#9b59b6';
        for (let cp of checkpoints) ctx.fillRect(cp[0], cp[1], cp[2], cp[3]);

        // Yellow Slopes
        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        for (let s of slopes) {
            ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
        }

        // Goal Flag
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

        // Active Grapple Wire
        if (rope.active) {
            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(rope.x, rope.y); ctx.stroke();
        }

        // Player Avatar Ball
        ctx.save();                 
        ctx.translate(px, py); ctx.rotate(angle);          
        ctx.fillStyle = (dashCooldown === 0) ? '#5dade2' : '#3498db';
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-radius, 0); ctx.lineTo(radius, 0); ctx.stroke();
        ctx.restore();              

        // =========================================================================
        // NEW FEATURE: FLOATING CIRCULAR SPEEDOMETER UI
        // Renders at a fixed offset directly above the player's coordinate space.
        // =========================================================================
        ctx.save();
        ctx.translate(px, py - 45); // Float 45px directly above the ball

        // Calculate velocity-to-MPH math metrics
        let mph = Math.round(currentSpeed * 4);
        let maxMph = 130; 
        let speedPercent = Math.min(1, mph / maxMph);

        // 1. Draw Subtle Translucent Dial Plate Background
        ctx.fillStyle = 'rgba(20, 20, 20, 0.4)';
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();

        // 2. Draw Speed Bar Circular Background Track (Dark Gray)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        // Standard arc starting from top (-90 degrees) spanning full loop
        ctx.arc(0, 0, 16, -Math.PI / 2, (Math.PI * 2) - Math.PI / 2);
        ctx.stroke();

        // 3. Draw Dynamic Filled Circular Speed Bar Gauge (Neon Cyan/Orange mix based on redline)
        let barColor = (mph > 100) ? '#e67e22' : '#00f3ff';
        ctx.strokeStyle = barColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        // End angle scales according to speed percentage tracking
        let endAngle = (-Math.PI / 2) + (Math.PI * 2 * speedPercent);
        ctx.arc(0, 0, 16, -Math.PI / 2, endAngle);
        ctx.stroke();

        // 4. Render Numeric MPH Text Centered inside the Ring
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(mph, 0, -1);

        // 5. Render Label String right above the Ring boundary
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText("MPH", 0, -25);

        ctx.restore();

        ctx.restore(); // Final camera restore

    } else if (gameState === "VICTORY") {
        ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2c3e50';
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 4;
        ctx.roundRect((canvas.width/2) - 200, (canvas.height/2) - 130, 400, 260, 15);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("VICTORY!", canvas.width / 2, (canvas.height/2) - 50);

        ctx.fillStyle = '#ecf0f1';
        ctx.font = '18px sans-serif';
        ctx.fillText("You crossed the chasms and completed the track!", canvas.width / 2, (canvas.height/2));

        ctx.fillStyle = '#e67e22';
        ctx.roundRect((canvas.width/2) - 125, (canvas.height/2) + 40, 250, 45, 8);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText("PRESS SPACE TO RESTART", canvas.width / 2, (canvas.height/2) + 68);
    }

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
